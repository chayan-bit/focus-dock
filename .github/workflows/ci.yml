name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Owner pushes and same-repo PRs only; fork PRs run on the contributor's own CI.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build
      - run: swift build --build-tests --enable-code-coverage
      # Tests with LIBDISPATCH_COOPERATIVE_POOL_STRICT=1, then fails below 80% line coverage on FocusDockCore.
      - run: ./scripts/coverage.sh 80
        timeout-minutes: 5
      - run: ./scripts/build-app.sh
      # A .terminateLater quit must reply even when terminate is entered from the main queue.
      - run: ./scripts/check-quit.sh
        timeout-minutes: 2
