name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build
      - run: swift test
        timeout-minutes: 5
        env:
          # Pool width 1: a test that blocks a cooperative thread hangs here and locally alike.
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: 1
      - run: ./scripts/build-app.sh
